<!DOCTYPE html> 
<html lang="ja"> 
    <head> 
        <meta charset="UTF-8"> <style> 
            .top{/*hedderの設定をしたい。*/ 
              min-height: 50px; 
              background-color:orange;
              margin: 0 auto; 
              text-align: center; 
              width: 100%;
            } 
            .body{/*横幅の最小が380px,高さ400pxのものを製作したい。*/ 
              min-width: 380px; 
              height: 400px; 
              background-color: white; 
              margin: 0 auto;
              text-align: center; 
              border-left: 16px solid lightgreen; 
              border-right: 16px solid lightgreen;/*bodyの横側にラインを入れたい*/
            } 
            .bottom{/*footerの設定したい。*/ 
              min-height: 80px; 
              background-color: yellow; 
              margin: 0 auto; 
              text-align: center; 
            } 
            </style> 
            </head> 
            <body>
                <header class="top"> header </header> 
                <div class="body"> contentA </div>
                <footer class="bottom"> footer </footer> 
            </body> 
            </html>
