<!DOCTYPE html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <style>
       #example {
            position: relative;
            height: 500px;
            background-color: #A52A2A;
        }
        .top {
            z-index: 20;
            position: absolute;/*relativeとabsoluteはセットで使う。*/
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 150px;
            background-color: #FFEBCD;
        }
        .middle{

            position:absolute;
            top: 50%;
            left: 50%;
            transform:translate(-50%,-50%);
            width: 500px;
            height: 300px;
            background-color: aqua;
            text-align: center;
    }
    </style>
    </head>
    <body>
        <div id="example">
            <p>背景表示</p>
            <p class="middle"></p>
            <p class="top">ロゴ表示</p>
        </div>
    </body>
</html>
