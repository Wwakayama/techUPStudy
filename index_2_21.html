<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <style>
    input[type="radio"]{/*ラジオ全体を*/
      display:none;/*表示しないようにする。*/
    }
    .tab_area label{
      width:150px;/*横のサイズ*/
      margin:0 5px;/*余白のはなし*/
      display:inline-block;
      padding:12px 0;
      color:#999;
      background:wheat;
      text-align:center;/*中央ぞろえ*/
      font-size:13px;
      cursor:pointer;/*ポインターの形を変更する*/
      transition:ease 0.2s opacity;/*タブの状態間の変化を定義*/
    }
    .tab_panel{
      display:none;/*非表示*/
    }
    /* ラジオボタンでコンテンツ切り替えの制御 */
    /* 連動させるため、連動させる要素にfor属性でラジオボタンのidを指定 */
    /* ~ と同じ階層エリアに色変え　*/
    #tab1:checked ~ .tab_area .tab1_label{/**/
      background:wheat;
      color:black;
    }
    #tab1:checked ~ .panel_area #panel1{
      display:block;/* ブロックスにする */
    }
    #tab2:checked ~ .tab_area .tab2_label{
      background:wheat;
      color:black;
    }
    #tab2:checked ~ .panel_area #panel2{
      display:block;
    }
    #tab3:checked ~ .tab_area .tab3_label{
      background:wheat;
      color:black;
    }
    #tab3:checked ~ .panel_area #panel3{
      display:block;
    }
  </style>
</head>
  <body>
    <div class="tab_wrap">
        <input id="tab1" type="radio" name="tab_btn">
        <input id="tab2" type="radio" name="tab_btn">
        <input id="tab3" type="radio" name="tab_btn">

        <div class="tab_area">
            <label class="tab1_label" for="tab1">タブ1</label>
            <label class="tab2_label" for="tab2">タブ2</label>
            <label class="tab3_label" for="tab3">タブ3</label>
        </div>
        <div class="panel_area">
            <div id="panel1" class="tab_panel">
                <p>タブパネル-1</p>
            </div>
            <div id="panel2" class="tab_panel">
                <p>タブパネル-2</p>
            </div>
            <div id="panel3" class="tab_panel">
                <p>タブパネル-3</p>
            </div>
        </div>
    </div>
  
</body>
</html>
