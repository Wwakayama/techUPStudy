<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>index_3_16</title>
</head>
<body>
    <p>javascript Basics</p>
    
    <ul class="list-group">
    <li class="list-group-item">100</li>
    <li class="list-group-item">110</li>
    <li class="list-group-item">120</li>
    <li class="list-group-item">130</li>
    <li class="list-group-item">140</li>
    </ul>
    <button id="change">変更</button>
    <button id="reset">リセット</button>

    <script>
        "use strict";// 変数の宣言,エラーチェック

        //ul要素の取得
        const ulElement = document.querySelector(".list-group");

        //ul要素の子要素であるli要素の取得
        const listItems = ulElement.querySelectorAll("li");

        //初期値を格納する配列定義
        const defaultValues =[];

        //各li要素の初期値を取得し、配列に格納
        listItems.forEach(function(li) {
            defaultValues.push(parseInt(li.textContent,10));
        });

        //ここから変更ボタンのクリックイベント
        document.getElementById("change").addEventListener("click", function(){
            var listItems = document.querySelectorAll('.list-group-item');
        //各li要素の値を変更（）の中はlistItemsの中身をはじめから、一つずつ取得するためのコード
        for(var i = 0; i < listItems.length; i++){
            var number = parseInt(listItems[i].textContent, 10);
            listItems[i].textContent = number * 10;
            /*  listItems.forEach(function(item, index) {
                item.textContent = defaultValues[index] * 10;
            });
            */
        }
        });
        //ここからリセットボタンのクリックイベント
        document.getElementById("reset").addEventListener("click",function(){
            var listItems = document.querySelectorAll('.list-group-item');
            listItems.forEach(function(li, index){
                li.textContent = defaultValues[index];
            });
        })
    </script>
</body>
</html>
