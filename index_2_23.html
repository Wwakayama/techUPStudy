<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>index_2_23.html</title>
<style>
  .row {
    display: grid;
  }

  .one {
    grid-template-columns: 1fr;
  }

  .two {
    grid-template-columns: 1fr 1fr;
  }

  .three {
    grid-template-columns: 1fr 1fr 1fr;
  }

  .box {
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
  }
  .red{
    background-color: red;
  }
  .aqua{
    background-color: aqua;
  }
  .yellow{
    background-color: yellow;
  }
</style>
</head>
<body>

  <!-- 1行目：1カラム -->
  <div class="row one">
    <div class="box red">footer</div>
  </div>

  <!-- 2行目：2カラム -->
  <div class="row two">
    <div class="box aqua">content-1</div>
    <div class="box yellow">content-2</div>
  </div>

  <!-- 3行目：3カラム -->
  <div class="row three">
    <div class="box red">content3-1</div>
    <div class="box">content3-2</div>
    <div class="box aqua">content3-3</div>
  </div>

  <!-- 4行目：2カラム -->
  <div class="row two">
    <div class="box yellow">content4-1</div>
    <div class="box red">content4-2</div>
  </div>

  <!-- 5行目：1カラム -->
  <div class="row one">
    <div class="box aqua">footer</div>
  </div>

</body>
</html>
