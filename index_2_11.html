<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>
           CSS style サンプル
        </title>
        <style media="screen">
            h1{
                color: red;/*文字を色つけることできるぞ*/
                background-color: white;/*色でも行ける*/
                transform: rotate(0rad);/*試してみたけど、全体が斜めになったので没*/
                /*確かExcelでイタリックあったからそれか・・・？*/
            }
            p{
                color: #000;/*いわゆるカラーコードってやつ*/
                background-color: #00FFFF;
            }
        </style>
    </head>
    <h1 style="font-style: italic;">これは表題です</h1>
</html>
