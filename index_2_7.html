<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>H-7.フォーム部品について</title>
        <style>

            form{margin-bottom: 10px;}/*各フォームの下に空白ができるようにするらしい。*/
            label{
                display: inline-block;
                width: 90px;
                text-align: left;
                margin-right: 8px;
            }   /*これは、それっぽくするためにわからなかったので調べてすこし直しました。*/
        </style>
    </head>
    <form>
        <label>名前</label>
        <input type="text" 
        name="title" size="20" maxlength="28" >
    </form>
    <form>
        <label>パスワード</label>
        <input type="password" 
        name="title" size="20" maxlength="28" >
    </form>
    <form>
        <label>性別</label>
        <input type="radio" name="test" value="test1"/>男
        <input type="radio" name="test" value="test2"  checked="checked"/>女
    </form>
    <form> 
        <label>県</label>
        <select name="ken">
        <option value="ken1">東京</option>
        <option value="ken2">神奈川</option>
        <option value="ken3">千葉</option>
        <option value="ken4">埼玉</option>
        <option value="ken5">栃木</option>
        <option value="ken6">群馬</option>
        <option value="ken7">茨城</option>
    </select>
    </form>
    <form>
        <label>紹介
        </label>
        <textarea name="txt" rows="5" cols="20">
        </textarea>
    </form>

    <form>
        <label>ボタン</label>
        <input type="submit" name="btn3" value="送信" >
    </form>
</html>
