<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-8 構文の使い方課題提出</title>
</head>
    <body>
        <p>javascript Basics</p>
        <script>
            'use strict';
            const input = ['a', 'b', 'c'];/*const inputに配列を代入する。ちなみに再代入不可*/
            const output = input.map((value) => {
                return value+"_set";
            });
            console.log(output);/*mapで配列の要素を一つずつ取り出し、valueに代入して、returnで返す。返された値はoutputに代入される。*/
        </script>
    </body>
</html>
