<!DOCTYPE html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <style>
       #example {
        position: relative;
            height: 300px;
            background-color: #A52A2A;
        }
        .top, .middle, .background {
        position: absolute;
        }
        .top  {
        z-index: 30;
        background-color: #FFEBCD;
        left: 200px;
        top: 40px;
        height: 100px;/*高さ指定*/
        width: 100px;/*幅指定*/
        }
        .middle {
        z-index: 20;
        background-color: #00FFFF;
        left: 20%;
        top: 0px;
        height: 200px;/*高さ指定*/
        width: 600px;/*幅指定*/
        }
        .background {
        z-index: 10;/*どっちが上になるかやで。*/
        left: 0%;/*左右の位置です*/
        top: 0%;/*上下の位置です*/
        background-color: #A52A2A;/*背景です*/
        height: 300px;/*高さ指定*/
        width: 900px;/*幅指定*/
        }
    </style>
    </head>
    <body>
        <div id="example">
            <p class="background">背景表示</p>
            <p class="middle"></p>
            <p class="top">ロゴ表示</p>
        </div>
    </body>
</html>
