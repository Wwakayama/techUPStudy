<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
<title>Level2-18 課題用</title>
  <style>
    .sample{
     font-size: 30px;
    }
    a:hover {
      color:red;
    }
    div:dir(rtl){
      font-weight: bolder;/*左から右に書くだけ、ヘブライ語なら逆に、rtlを入力。*/
    }
  </style>
</head>
  <body>
    <div dir="rtl">
      <a class="sample" href="https://techup.shop">サンプルリンク</a>
    </div>
  </body>
</html>
