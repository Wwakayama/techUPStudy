<!DOCTYPE html>
<html lang="ja">
    

<head>
    <meta charset="UTF-8">
    <title>プロフールの作成を作成してみよう！

</head>
<body>

            <td><input type="number" name="age" size="20" min="1"max="100"/></td>
        </tr>
        <tr>
        <th>自己紹介</th>
        <td><textarea name = "txt" rows="5"cols="20"></textarea></td>
        </tr>
        <tr>
            <th>出身地</th>
            <td>

    <option value="北海道">北海道</option>

    <option value="富山">富山県</option>
    <option value="石川">石川県</option>
    <option value="福井">福井県</option>
    <option value="山梨">山梨県</option>
    <option value="長野">長野県</option>
    <option value="岐阜">岐阜県</option>
    <option value="静岡">静岡県</option>
    <option value="愛知">愛知県</option>
    <option value="三重">三重県</option>
    <option value="滋賀">滋賀県</option>
    <option value="京都">京都府</option>
    <option value="大阪">大阪府</option>
    <option value="兵庫">兵庫県</option>
    <option value="奈良">奈良県</option>
    <option value="和歌山">和歌山県</option>
    <option value="鳥取">鳥取県</option>
    <option value="島根">島根県</option>
    <option value="岡山">岡山県</option>
    <option value="広島">広島県</option>
    <option value="山口">山口県</option>
    <option value="徳島">徳島県</option>
    <option value="香川">香川県</option>
    <option value="愛媛">愛媛県</option>
    <option value="高知">高知県</option>
    <option value="福岡">福岡県</option>

    <option value="長崎">長崎県</option>

    <option value="鹿児島">鹿児島県</option>
    <option value="沖縄">沖縄県</option>

            </td>
        </tr>
    <tr>
        <th>性別:
            <td>
                <input type="radio" name="sexual"value="男">男
                <input type="radio" name="sexual"value="女">女
                <input type="radio" name="sexual"value="else">その他
            </td>
        </th>
    </tr>
    <tr>
        <th>趣味
            <td>
                <input type="checkbox"name="hobby">カラオケ
                <input type="checkbox"name="hobby">お酒
                <input type="checkbox"name="hobby">読書
                <input type="checkbox"name="hobby">推し活
                <input type="checkbox"name="hobby">ソシャゲ
            </td>
        </th>
    </tr>
    <tr>
        <th>生年月日</th>
        <td><input type="date" name="birthday"value="1980-01-01"min="1980-01-01"max="2021-01-01"></td>
    </tr>
    <tr>
        <th>pw</th>
        <td><input type="password" name="password"maxlength="5"></td>
    </tr>
    <tr>
        <th>顔写真</th>
        <td><input type="file"name="picture"></td>
    </tr>
    <tr>
        <td><input type="submit" value="確定"onclick="alert('確定しました！');"></td>
    </tr>
